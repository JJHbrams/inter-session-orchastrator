<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Rooms</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><aside class="sidebar"><div class="brand">◈ <span>Session Rooms</span></div><div class="side-actions"><button id="newChannel">+ 채널</button><button id="newRoom" class="accent">+ 토론장</button></div><nav id="rooms" aria-label="채널과 토론장"></nav><button id="discover" class="ghost">Orca 세션 찾기</button></aside><section class="workspace"><header class="topbar"><div><p class="eyebrow">LOCAL ROOM</p><h1 id="title">토론장을 선택하세요</h1></div><div class="room-actions"><button id="pause">중지</button><button id="archive">보관</button></div></header><section id="participants" class="participants" aria-label="참여자"></section><div class="content"><article class="conversation"><div id="error" role="alert"></div><div id="timeline" class="timeline" aria-live="polite"><div class="empty"><h2>공유 대화를 시작하세요</h2><p>토론장을 만들고 정확히 등록된 세션을 초대하면, 원문·수신자·전달 증거를 한곳에서 확인할 수 있습니다.</p></div></div><form id="composer" class="composer"><label>전달 방식<select id="kind"><option value="post">게시</option><option value="notify">알림</option><option value="followup">실행 요청</option><option value="steer">명시적 steer</option></select></label><label>대상<select id="targetMode"><option value="individual">선택</option><option value="all">전체</option><option value="chair">좌장</option></select></label><div id="targetList" class="target-list"></div><label class="message-label">내용<textarea id="body" required maxlength="8000" placeholder="공동 대화에 남길 내용을 입력하세요"></textarea></label><div class="composer-footer"><span id="composeNote">게시와 알림은 실행 요청이 아닙니다.</span><button class="accent" type="submit">보내기</button></div></form></article><aside class="inspector"><section><h2>결정</h2><div id="decisions" class="decision-list"></div></section><section><h2>선택한 참여자</h2><div id="memberDetail" class="detail">카드를 선택하면 신원·모드·권한·관측 상태를 보여줍니다.</div></section><section><h2>연결 안내</h2><p class="muted">읽기 전용 세션은 대화와 상태를 볼 수 있지만 실행 요청을 받지 않습니다. 토큰은 초대한 세션에만 별도 전달하세요.</p></section></aside></div></section></main><dialog id="roomDialog"><form method="dialog"><h2>토론장 만들기</h2><label>이름<input id="roomName" required maxlength="120" placeholder="예: API 호환성"></label><label>채널<select id="channelChoice"><option value="">채널 없음</option></select></label><menu><button value="cancel">취소</button><button id="createRoom" class="accent" value="default">만들기</button></menu></form></dialog><dialog id="channelDialog"><form method="dialog"><h2>채널 만들기</h2><label>이름<input id="channelName" required maxlength="80" placeholder="예: 개발"></label><menu><button value="cancel">취소</button><button id="createChannel" class="accent" value="default">만들기</button></menu></form></dialog><script type="module" src="/app.js"></script></body></html>
